name: Portfolio Sync

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'projects/**/*.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Parse Markdown and Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node scripts/sync-portfolio.js

      - name: Deploy Summary
        run: |
          echo " Portfolio sync completed"
          echo " Processed entries from README.md"
          echo " Supabase database updated"
